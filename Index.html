<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F6F4;
    --panel: #FFFFFF;
    --ink: #1B2B26;
    --muted: #5B6B65;
    --line: #D3DDD8;
    --spruce: #2F6A55;
    --spruce-deep: #214D3D;
    --spruce-soft: #E2EDE7;
    --amber: #8A5A00;
    --amber-bg: #FCF0D5;
    --brick: #9E3826;
    --brick-bg: #F8E4DF;
    --radius: 6px;
    --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #7FB59E; outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* Buttons */
  .btn { border: 1px solid var(--spruce); background: var(--spruce); color: #fff; padding: .6rem 1.1rem; border-radius: var(--radius); cursor: pointer; font-weight: 700; }
  .btn:hover { background: var(--spruce-deep); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.quiet { background: transparent; color: var(--spruce); }
  .btn.quiet:hover { background: var(--spruce-soft); }
  .link { background: none; border: 0; padding: 0; color: var(--spruce); text-decoration: underline; cursor: pointer; }
  .danger { color: var(--brick); border-color: var(--brick); }
  .danger:hover { background: var(--brick-bg); }

  /* Sign-in */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
  .gate-card { width: 100%; max-width: 26rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 2rem; }
  .gate h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 .5rem; }
  .gate p { margin: 0 0 1.25rem; color: var(--muted); }
  .gate label { display: block; font-weight: 700; margin-bottom: .35rem; }
  .gate input { width: 100%; padding: .7rem .8rem; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 1rem; }
  .gate input.code { font-size: 1.6rem; letter-spacing: .4em; text-align: center; }
  .gate .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  .msg { padding: .7rem .9rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: .95rem; }
  .msg.err { background: var(--brick-bg); color: var(--brick); }
  .msg.ok { background: var(--spruce-soft); color: var(--spruce-deep); }

  /* App shell */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 1rem; padding: .6rem 1.25rem; flex-wrap: wrap; }
  .bar .who { font-weight: 700; }
  .bar .who small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }
  .bar .spacer { flex: 1; }
  .bar select { padding: .4rem .5rem; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .status { font-size: .9rem; color: var(--muted); display: flex; align-items: center; gap: .4rem; }
  .status .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--spruce); }
  .status.dirty .dot, .status.saving .dot { background: #C99A2E; }
  .status.error { color: var(--brick); }
  .status.error .dot { background: var(--brick); }

  .shell { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); gap: 2rem; max-width: 72rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  /* Section spine: numbers are the real order of the profile */
  .spine { position: sticky; top: 4.5rem; align-self: start; }
  .spine ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  .spine button { display: grid; grid-template-columns: 2.2rem 1fr; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: .55rem .5rem .55rem .9rem; margin-left: -2px; border-left: 2px solid transparent; cursor: pointer; }
  .spine button:hover { background: var(--spruce-soft); }
  .spine button[aria-current="step"] { border-left-color: var(--spruce); background: var(--panel); }
  .spine .num { font-size: 1.35rem; font-weight: 700; color: var(--line); line-height: 1; }
  .spine button[aria-current="step"] .num, .spine button.started .num { color: var(--spruce); }
  .spine .t { font-weight: 700; font-size: .95rem; line-height: 1.25; }
  .spine .p { grid-column: 2; font-size: .8rem; color: var(--muted); }
  .spine .p .flag { color: var(--amber); }
  .spine-select { display: none; }

  main h2 { font-size: 2rem; line-height: 1.15; margin: 0 0 .4rem; }
  main h2 .n { color: var(--spruce); margin-right: .4rem; }
  main .help { color: var(--muted); margin: 0 0 1.75rem; max-width: 40rem; }
  main h3 { font-size: 1.2rem; margin: 2.25rem 0 .25rem; }
  main h3 + .help { margin-bottom: 1rem; }

  /* Fields */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem 1.25rem; }
  .field { display: flex; flex-direction: column; gap: .3rem; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-weight: 700; font-size: .95rem; }
  .field .hint { font-size: .85rem; color: var(--muted); margin-top: -.2rem; }
  .field input, .field select, .field textarea { width: 100%; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .field textarea { min-height: 5.5rem; resize: vertical; }
  .field textarea.tall { min-height: 14rem; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--spruce); }
  .field .auto { padding: .55rem .7rem; background: var(--paper); border-radius: var(--radius); color: var(--muted); min-height: 2.6rem; }

  /* Entries (one per table row) */
  .entries { display: flex; flex-direction: column; gap: .6rem; }
  .entry { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .entry.open { border-color: #9DBFB0; }
  .entry-head { width: 100%; display: flex; gap: .75rem; align-items: center; background: none; border: 0; padding: .8rem 1rem; text-align: left; cursor: pointer; }
  .entry-head .item { font-weight: 700; color: var(--spruce); min-width: 2.2rem; }
  .entry-head .title { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-head .title.empty { color: var(--muted); font-weight: 400; font-style: italic; }
  .entry-head .chev { color: var(--muted); transition: transform .15s; }
  .entry.open .chev { transform: rotate(90deg); }
  .tags { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: .78rem; padding: .1rem .5rem; border-radius: 999px; background: var(--paper); color: var(--muted); white-space: nowrap; }
  .tag.warn { background: var(--amber-bg); color: var(--amber); }
  .tag.bad { background: var(--brick-bg); color: var(--brick); font-weight: 700; }
  .entry-body { padding: .25rem 1rem 1rem; border-top: 1px solid var(--line); }
  .entry-body .fields { margin-top: 1rem; }
  .entry-foot { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }
  .add { margin-top: .9rem; }
  .full-note { color: var(--muted); font-size: .9rem; margin-top: .75rem; }

  .pager { display: flex; justify-content: space-between; margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }

  .banner { max-width: 72rem; margin: 1rem auto 0; padding: .8rem 1rem; border-radius: var(--radius); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .banner.warn { background: var(--amber-bg); color: var(--amber); }
  .banner.err { background: var(--brick-bg); color: var(--brick); }

  .loading { padding: 4rem 1rem; text-align: center; color: var(--muted); }

  @media (max-width: 52rem) {
    .shell { grid-template-columns: 1fr; gap: 1rem; padding-top: 1rem; }
    .spine ol { display: none; }
    .spine { position: static; }
    .spine-select { display: block; width: 100%; padding: .6rem; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; font-weight: 700; }
    .fields { grid-template-columns: 1fr; }
    main h2 { font-size: 1.6rem; }
    .entry-head .tags { display: none; }
  }
</style>
</head>
<body data-hint="<?= hint ?>" data-org="<?= orgName ?>">

<!-- Sign-in -->
<section id="gate" class="gate" hidden>
  <div class="gate-card">
    <h1 id="gate-title">Your role profile</h1>
    <p id="gate-sub">Sign in with the email on file. We'll send you a 6-digit code. No password needed.</p>
    <div id="gate-msg" class="msg" hidden></div>

    <form id="step-email" autocomplete="on">
      <div id="known" hidden>
        <p id="known-text"></p>
      </div>
      <div id="ask-email">
        <label for="email">Work email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="row">
        <button class="btn" type="submit" id="send-btn">Email me a code</button>
        <button class="link" type="button" id="not-me" hidden>Not you?</button>
      </div>
    </form>

    <form id="step-code" hidden>
      <label for="code">Code from your email</label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <div class="row">
        <button class="btn" type="submit" id="verify-btn">Sign in</button>
        <button class="link" type="button" id="resend">Send a new code</button>
      </div>
    </form>
  </div>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="bar">
    <div class="who" id="who"></div>
    <label id="admin-pick-wrap" hidden>
      <span class="sr" style="position:absolute;left:-9999px">Profile to edit</span>
      <select id="admin-pick"></select>
    </label>
    <div class="spacer"></div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Saved</span></div>
    <button class="btn quiet" id="save-now" type="button">Save now</button>
    <button class="btn quiet" id="sign-out" type="button">Sign out</button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="shell">
    <nav class="spine" aria-label="Profile sections">
      <select class="spine-select" id="spine-select" aria-label="Section"></select>
      <ol id="spine"></ol>
    </nav>
    <main id="main" tabindex="-1"><div class="loading">Loading your profile…</div></main>
  </div>
</div>

<div id="boot" class="loading">Loading…</div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const HINT = document.body.dataset.hint || '';
  const TOKEN_KEY = 'lw_role_profile_token';
  const AUTOSAVE_MS = 2500;

  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null, args);
    });
  }
  function store(v) { try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function stored() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
  function h(tag, attrs, kids) {
    const el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(k => {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(c => { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  const isSessionError = e => String(e && e.message || e).indexOf('SESSION_EXPIRED') >= 0;
  const errText = e => String(e && e.message || e || 'Something went wrong.').replace(/^Error:\s*/, '');

  /* ---------- state ---------- */
  const S = {
    token: null, user: null, tabs: [], lists: {}, schema: [],
    tab: null, ownerName: '', version: '0', meta: null, data: null,
    current: 'overview', dirty: new Set(), saving: false, timer: null,
    open: {}, shown: {}, identifier: '', resumeAfterAuth: null, conflict: false,
  };

  /* ---------- sign-in ---------- */
  function gateMsg(text, kind) {
    const m = $('gate-msg');
    m.textContent = text || '';
    m.className = 'msg ' + (kind || 'err');
    m.hidden = !text;
  }
  function showGate(reason) {
    $('boot').hidden = true;
    $('gate').hidden = false;
    $('step-email').hidden = false;
    $('step-code').hidden = true;
    gateMsg(reason || '', 'err');
    if (HINT && !S.identifier) {
      call('api_hint', HINT).then(r => {
        if (r && r.found) {
          S.identifier = HINT;
          $('known').hidden = false;
          $('ask-email').hidden = true;
          $('not-me').hidden = false;
          $('email').required = false;
          $('gate-title').textContent = 'Hi ' + r.first;
          $('known-text').textContent = "We'll email a sign-in code to " + r.masked + '.';
        }
      }).catch(() => {});
    }
  }
  $('not-me').addEventListener('click', () => {
    S.identifier = '';
    $('known').hidden = true; $('ask-email').hidden = false; $('not-me').hidden = true;
    $('email').required = true; $('gate-title').textContent = 'Your role profile';
    $('email').focus();
  });

  function sendCode() {
    const id = S.identifier || $('email').value.trim();
    if (!id) return;
    S.identifier = id;
    $('send-btn').disabled = true; $('resend').disabled = true;
    gateMsg('');
    call('api_requestCode', id).then(r => {
      $('send-btn').disabled = false; $('resend').disabled = false;
      if (!r.ok) { if (!HINT) S.identifier = ''; return gateMsg(r.error); }
      $('step-email').hidden = true;
      $('step-code').hidden = false;
      gateMsg('Code sent to ' + r.masked + '. It can take a minute to arrive; check spam if you don\'t see it.', 'ok');
      $('code').value = ''; $('code').focus();
    }).catch(e => { $('send-btn').disabled = false; $('resend').disabled = false; gateMsg(errText(e)); });
  }
  $('step-email').addEventListener('submit', e => { e.preventDefault(); sendCode(); });
  $('resend').addEventListener('click', sendCode);

  $('step-code').addEventListener('submit', e => {
    e.preventDefault();
    $('verify-btn').disabled = true;
    call('api_verify', S.identifier, $('code').value.trim()).then(r => {
      $('verify-btn').disabled = false;
      if (!r.ok) return gateMsg(r.error);
      store(r.token);
      onAuthed(r);
    }).catch(err => { $('verify-btn').disabled = false; gateMsg(errText(err)); });
  });

  function onAuthed(boot) {
    S.token = boot.token;
    $('gate').hidden = true; $('boot').hidden = true;
    if (S.resumeAfterAuth && S.user && S.user.name === boot.user.name) {
      // Signed back in mid-session: keep unsaved edits and carry on saving.
      const next = S.resumeAfterAuth; S.resumeAfterAuth = null;
      $('app').hidden = false; next();
      return;
    }
    S.user = boot.user; S.tabs = boot.tabs; S.lists = boot.lists; S.schema = boot.schema;
    $('app').hidden = false;
    renderBar();
    loadTab(boot.tabs.length === 1 ? boot.tabs[0].tab : (boot.user.tab || (boot.tabs[0] && boot.tabs[0].tab)));
  }

  function expireSession() {
    store(null);
    S.resumeAfterAuth = () => flush();
    $('app').hidden = true;
    showGate('Your sign-in expired. Sign in again to keep saving. Your unsaved changes are kept on this page.');
  }

  /* ---------- loading ---------- */
  function loadTab(tab) {
    $('main').replaceChildren(h('div', { class: 'loading', text: 'Loading profile…' }));
    hideBanner();
    return call('api_load', S.token, tab).then(r => {
      S.tab = r.tab; S.ownerName = r.ownerName; S.version = r.version; S.meta = r.meta; S.data = r.data;
      S.dirty.clear(); S.open = {}; S.shown = {}; S.conflict = false;
      // Pre-fill the name from the roster on a brand-new profile.
      if (!S.data.overview.fields.B5 && S.user.role !== 'admin') { S.data.overview.fields.B5 = S.user.name; markDirty('overview'); }
      $('admin-pick').value = S.tab;
      setStatus();
      renderBar(); renderSpine(); renderSection();
    }).catch(e => {
      if (isSessionError(e)) { store(null); $('app').hidden = true; return showGate('Sign in to continue.'); }
      $('main').replaceChildren(h('div', { class: 'loading', text: errText(e) }));
    });
  }

  /* ---------- saving ---------- */
  function markDirty(id) {
    S.dirty.add(id);
    setStatus();
    clearTimeout(S.timer);
    S.timer = setTimeout(flush, AUTOSAVE_MS);
  }

  function flush() {
    clearTimeout(S.timer);
    if (S.saving || !S.dirty.size || S.conflict) return Promise.resolve();
    const ids = Array.from(S.dirty);
    const changes = {};
    ids.forEach(id => { changes[id] = JSON.parse(JSON.stringify(S.data[id])); });
    S.dirty.clear();
    S.saving = true; setStatus();
    return call('api_save', S.token, S.tab, S.version, changes).then(r => {
      S.saving = false;
      if (r.conflict) {
        ids.forEach(id => S.dirty.add(id));
        S.conflict = true; setStatus();
        const who = r.meta ? ' by ' + r.meta.by + ' at ' + new Date(r.meta.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
        showBanner('warn', 'This profile was saved from another window' + who + '. Reload to get the latest version before making more changes. Changes made here since your last save will not be kept.', 'Reload profile', () => loadTab(S.tab));
        return;
      }
      S.version = r.version; S.meta = r.meta;
      setStatus(); renderSpine();
      if (S.dirty.size) S.timer = setTimeout(flush, AUTOSAVE_MS);
    }).catch(e => {
      S.saving = false;
      ids.forEach(id => S.dirty.add(id));
      if (isSessionError(e)) return expireSession();
      setStatus('error', "Couldn't save. Retrying…");
      S.timer = setTimeout(flush, 6000);
    });
  }

  function setStatus(kind, text) {
    const el = $('status');
    let k = kind, t = text;
    if (!k) {
      if (S.conflict) { k = 'error'; t = 'Not saved: profile changed elsewhere'; }
      else if (S.saving) { k = 'saving'; t = 'Saving…'; }
      else if (S.dirty.size) { k = 'dirty'; t = 'Unsaved changes'; }
      else {
        k = '';
        t = S.meta ? 'Saved ' + friendlyTime(S.meta.at) + (S.meta.by && S.meta.by !== S.user.name ? ' by ' + S.meta.by : '') : 'Nothing saved yet';
      }
    }
    el.className = 'status ' + (k || '');
    $('status-text').textContent = t;
  }
  function friendlyTime(ms) {
    const d = new Date(ms), now = new Date();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return d.toDateString() === now.toDateString() ? 'at ' + time : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + time;
  }
  $('save-now').addEventListener('click', flush);
  window.addEventListener('beforeunload', e => {
    if (S.dirty.size || S.saving) { e.preventDefault(); e.returnValue = ''; }
  });

  function showBanner(kind, text, action, fn) {
    const b = $('banner');
    b.className = 'banner ' + kind;
    b.replaceChildren(h('span', { text }), action ? h('button', { class: 'btn', type: 'button', text: action, onclick: fn }) : null);
    b.hidden = false;
  }
  function hideBanner() { $('banner').hidden = true; }

  /* ---------- header ---------- */
  function renderBar() {
    const admin = S.user.role === 'admin';
    $('who').replaceChildren(
      document.createTextNode(admin && S.tab ? S.ownerName : S.user.name),
      h('small', { text: admin ? 'Signed in as ' + S.user.name + ' (admin)' : 'Your role profile' })
    );
    const wrap = $('admin-pick-wrap');
    wrap.hidden = !admin;
    if (admin && !$('admin-pick').options.length) {
      S.tabs.forEach(t => $('admin-pick').appendChild(h('option', { value: t.tab, text: t.name + ' (' + t.tab + ')' })));
    }
  }
  $('admin-pick').addEventListener('change', e => {
    const to = e.target.value;
    flush().then(() => loadTab(to));
  });
  $('sign-out').addEventListener('click', () => {
    flush().then(() => call('api_logout', S.token)).catch(() => {}).then(() => { store(null); location.reload(); });
  });

  /* ---------- section navigation ---------- */
  function sectionProgress(sec) {
    const d = S.data[sec.id];
    const bits = [];
    let started = false;
    if (sec.fields) {
      const filled = sec.fields.filter(f => String(d.fields[f.cell] || '').trim()).length;
      if (filled) started = true;
      bits.push(filled + ' of ' + sec.fields.length + ' answered');
    }
    if (sec.table) {
      const n = d.rows.filter(r => rowHasData(sec, r)).length;
      if (n) started = true;
      bits.push(n + (n === 1 ? ' entry' : ' entries'));
    }
    const flags = sec.table ? d.rows.reduce((a, r, i) => a + (rowHasData(sec, r) ? rowFlags(sec, r, i).filter(f => f.kind !== 'info').length : 0), 0) : 0;
    return { text: bits.join(', '), started, flags };
  }

  function renderSpine() {
    const ol = $('spine'), sel = $('spine-select');
    ol.replaceChildren(); sel.replaceChildren();
    S.schema.forEach(sec => {
      const pr = sectionProgress(sec);
      const btn = h('button', {
        type: 'button', class: pr.started ? 'started' : '',
        'aria-current': S.current === sec.id ? 'step' : null,
        onclick: () => go(sec.id),
      }, [
        h('span', { class: 'num', text: String(sec.n) }),
        h('span', { class: 't', text: sec.title }),
        h('span', { class: 'p' }, [pr.text, pr.flags ? h('span', { class: 'flag', text: ', ' + pr.flags + ' to check' }) : null]),
      ]);
      ol.appendChild(h('li', {}, [btn]));
      sel.appendChild(h('option', { value: sec.id, text: sec.n + '. ' + sec.title, selected: S.current === sec.id }));
    });
  }
  $('spine-select').addEventListener('change', e => go(e.target.value));

  function go(id) {
    if (S.dirty.size) flush();
    S.current = id;
    renderSpine(); renderSection();
    $('main').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  /* ---------- section rendering ---------- */
  function renderSection() {
    const sec = S.schema.find(s => s.id === S.current);
    const idx = S.schema.indexOf(sec);
    const kids = [
      h('h2', {}, [h('span', { class: 'n', text: sec.n + '.' }), sec.title]),
      h('p', { class: 'help', text: sec.help }),
    ];
    if (sec.fields) kids.push(renderFields(sec));
    if (sec.table) {
      if (sec.fields) {
        kids.push(h('h3', { text: sec.table.title || 'Entries' }));
        if (sec.table.help) kids.push(h('p', { class: 'help', text: sec.table.help }));
      }
      kids.push(renderTable(sec));
    }
    const prev = S.schema[idx - 1], next = S.schema[idx + 1];
    kids.push(h('div', { class: 'pager' }, [
      prev ? h('button', { class: 'btn quiet', type: 'button', text: '‹ ' + prev.title, onclick: () => go(prev.id) }) : h('span'),
      next ? h('button', { class: 'btn', type: 'button', text: 'Next: ' + next.title, onclick: () => go(next.id) })
           : h('button', { class: 'btn', type: 'button', text: 'Save now', onclick: flush }),
    ]));
    $('main').replaceChildren.apply($('main'), kids);
  }

  function renderFields(sec) {
    const wrap = h('div', { class: 'fields' });
    const d = S.data[sec.id].fields;
    sec.fields.forEach(f => {
      const id = 'f_' + f.cell;
      const input = control(f, d[f.cell], id, v => { d[f.cell] = v; markDirty(sec.id); });
      wrap.appendChild(h('div', { class: 'field' + (f.type === 'textarea' ? ' wide' : '') }, [
        h('label', { for: id, text: f.label }),
        f.hint ? h('span', { class: 'hint', text: f.hint }) : null,
        input,
      ]));
    });
    return wrap;
  }

  function options(listName, current) {
    let opts = (S.lists[listName] || []).slice();
    if (current && opts.indexOf(current) < 0) opts.push(current); // never hide existing data
    return opts.map(o => ({ value: o, label: o }));
  }

  function jdItemOptions(current) {
    const rows = S.data.written.rows;
    const opts = [];
    rows.forEach((r, i) => {
      if (String(r.A || '').trim()) {
        const t = r.A.length > 70 ? r.A.slice(0, 70) + '…' : r.A;
        opts.push({ value: String(i + 1), label: (i + 1) + '. ' + t });
      }
    });
    if (current && !opts.some(o => o.value === String(current))) opts.push({ value: String(current), label: current + ' (not in Section 2)' });
    return opts;
  }

  function control(def, value, id, onChange) {
    value = value == null ? '' : String(value);
    let el;
    if (def.type === 'select' || def.type === 'jdItem') {
      const opts = def.type === 'jdItem' ? jdItemOptions(value) : options(def.list, value);
      el = h('select', { id }, [h('option', { value: '', text: def.type === 'jdItem' && !opts.length ? 'Add items in Section 2 first' : 'Choose…' })]
        .concat(opts.map(o => h('option', { value: o.value, text: o.label, selected: o.value === value }))));
      el.addEventListener('change', () => onChange(el.value));
      return el;
    }
    if (def.type === 'textarea') {
      el = h('textarea', { id, class: def.tall ? 'tall' : null });
      el.value = value;
    } else {
      el = h('input', {
        id,
        type: def.type === 'date' ? 'date' : 'text',
        inputmode: def.type === 'number' ? 'decimal' : null,
      });
      el.value = value;
    }
    el.addEventListener('input', () => onChange(el.value));
    return el;
  }

  /* ---------- tables as entries ---------- */
  function rowHasData(sec, r) {
    return sec.table.cols.some(c => c.type !== 'auto' && String(r[c.col] || '').trim());
  }
  const primaryCol = sec => sec.table.cols.find(c => c.primary) || sec.table.cols[0];

  function hoursPerYear(r) {
    const g = parseFloat(String(r.G || '').replace(/,/g, ''));
    const occ = S.lists.occurrences ? S.lists.occurrences[r.E] : undefined;
    if (!r.E || isNaN(g) || occ === undefined) return '';
    return String(Math.round(g * occ * 10) / 10);
  }
  function matchCount(itemNo) {
    return S.data.duties.rows.filter(r => String(r.C || '').trim() === String(itemNo)).length;
  }
  function autoValue(sec, c, r, i) {
    if (sec.id === 'written') {
      if (!String(r.A || '').trim()) return '';
      if (c.col === 'C') return String(i + 1);
      if (c.col === 'F') return String(matchCount(i + 1));
      if (c.col === 'G') return matchCount(i + 1) ? 'OK' : 'No matching duty';
    }
    if (sec.id === 'duties' && c.col === 'H') return hoursPerYear(r);
    return '';
  }

  // Mirrors the amber/red highlights in the spreadsheet.
  function rowFlags(sec, r, i) {
    const f = [];
    const L = S.lists;
    if (sec.id === 'written' && String(r.A || '').trim() && !matchCount(i + 1)) f.push({ kind: 'warn', text: 'No matching duty' });
    if (sec.id === 'duties') {
      if (!r.B) f.push({ kind: 'warn', text: 'Not compared to written JD' });
      else if (r.B !== (L.jdMatch || [])[2] && !String(r.C || '').trim()) f.push({ kind: 'warn', text: 'Missing item #' });
      if (r.I === 'Yes' && !r.M) f.push({ kind: 'bad', text: 'No backup' });
    }
    if (sec.id === 'meetings' && r.H === 'Yes' && !r.M) f.push({ kind: 'bad', text: 'No backup' });
    if (sec.id === 'deadlines' && r.C === 'Yes' && !r.F) f.push({ kind: 'bad', text: 'No backup' });
    return f;
  }
  function rowTags(sec, r) {
    const pick = { duties: ['E', 'D'], meetings: ['E', 'C'], systems: ['C'], contacts: ['C', 'B'], deadlines: ['B'], written: ['D'] }[sec.id] || [];
    return pick.map(col => r[col]).filter(Boolean).map(t => ({ kind: 'info', text: t }));
  }

  function renderTable(sec) {
    const t = sec.table;
    const rows = S.data[sec.id].rows;
    S.open[sec.id] = S.open[sec.id] || new Set();
    S.shown[sec.id] = S.shown[sec.id] || new Set();
    const list = h('div', { class: 'entries' });
    const visible = [];
    rows.forEach((r, i) => { if (rowHasData(sec, r) || S.shown[sec.id].has(i)) visible.push(i); });
    visible.forEach(i => list.appendChild(renderEntry(sec, i)));

    const box = h('div', {}, [list]);
    if (!visible.length) list.appendChild(h('p', { class: 'help', text: 'Nothing here yet.' }));
    const free = rows.findIndex((r, i) => !rowHasData(sec, r) && !S.shown[sec.id].has(i));
    if (free >= 0) {
      box.appendChild(h('button', {
        class: 'btn quiet add', type: 'button', text: '+ ' + (t.add || 'Add an entry'),
        onclick: () => {
          S.shown[sec.id].add(free); S.open[sec.id].add(free);
          renderSection();
          const el = document.getElementById('c_' + sec.id + '_' + free + '_' + primaryCol(sec).col);
          if (el) el.focus();
        },
      }));
    } else {
      box.appendChild(h('p', { class: 'full-note', text: 'This section is full (' + t.rows + ' entries). Ask your admin to add room on your tab.' }));
    }
    return box;
  }

  function renderEntry(sec, i) {
    const r = S.data[sec.id].rows[i];
    const isOpen = S.open[sec.id].has(i);
    const prim = primaryCol(sec);
    const entry = h('div', { class: 'entry' + (isOpen ? ' open' : '') });

    const title = h('span', { class: 'title' });
    const tags = h('span', { class: 'tags' });
    function refreshHead() {
      const v = String(r[prim.col] || '').trim();
      title.textContent = v || 'New entry';
      title.className = 'title' + (v ? '' : ' empty');
      tags.replaceChildren.apply(tags, rowFlags(sec, r, i).concat(rowTags(sec, r))
        .map(f => h('span', { class: 'tag ' + (f.kind === 'info' ? '' : f.kind), text: f.text })));
    }
    refreshHead();

    const head = h('button', {
      class: 'entry-head', type: 'button', 'aria-expanded': String(isOpen),
      onclick: () => { isOpen ? S.open[sec.id].delete(i) : S.open[sec.id].add(i); renderSection(); },
    }, [
      sec.table.numbered ? h('span', { class: 'item', text: '#' + (i + 1) }) : null,
      title, tags, h('span', { class: 'chev', 'aria-hidden': 'true', text: '›' }),
    ]);
    entry.appendChild(head);

    if (isOpen) {
      const fields = h('div', { class: 'fields' });
      const autos = [];
      sec.table.cols.forEach(c => {
        const id = 'c_' + sec.id + '_' + i + '_' + c.col;
        let ctl;
        if (c.type === 'auto') {
          ctl = h('div', { class: 'auto', id, text: autoValue(sec, c, r, i) || '—' });
          autos.push({ c, el: ctl });
        } else {
          ctl = control(c, r[c.col], id, v => {
            r[c.col] = v;
            markDirty(sec.id);
            refreshHead();
            autos.forEach(a => { a.el.textContent = autoValue(sec, a.c, r, i) || '—'; });
          });
        }
        fields.appendChild(h('div', { class: 'field' + (c.type === 'textarea' || c.primary ? ' wide' : '') }, [
          h(c.type === 'auto' ? 'span' : 'label', c.type === 'auto' ? { text: c.label + ' (automatic)', style: 'font-weight:700;font-size:.95rem' } : { for: id, text: c.label }),
          c.hint ? h('span', { class: 'hint', text: c.hint }) : null,
          ctl,
        ]));
      });

      const removeBtn = h('button', { class: 'btn quiet danger', type: 'button', text: 'Remove entry' });
      let armed = false;
      removeBtn.addEventListener('click', () => {
        if (!armed) {
          armed = true;
          const refs = sec.id === 'written' ? matchCount(i + 1) : 0;
          removeBtn.textContent = refs
            ? 'Remove? ' + refs + ' dut' + (refs === 1 ? 'y points' : 'ies point') + ' to item #' + (i + 1)
            : 'Click again to remove';
          return;
        }
        sec.table.cols.forEach(c => { if (c.type !== 'auto') r[c.col] = ''; });
        S.shown[sec.id].delete(i); S.open[sec.id].delete(i);
        markDirty(sec.id);
        renderSection(); renderSpine();
      });

      entry.appendChild(h('div', { class: 'entry-body' }, [
        fields,
        h('div', { class: 'entry-foot' }, [
          removeBtn,
          h('button', { class: 'btn quiet', type: 'button', text: 'Done', onclick: () => { S.open[sec.id].delete(i); renderSection(); renderSpine(); } }),
        ]),
      ]));
    }
    return entry;
  }

  /* ---------- start ---------- */
  const saved = stored();
  if (saved) {
    call('api_resume', saved).then(boot => onAuthed(boot)).catch(() => { store(null); showGate(); });
  } else {
    showGate();
  }
})();
</script>
</body>
</html>
